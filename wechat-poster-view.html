<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信长图预览 · 显微镜下的酒店AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#eef1ef; font-family:-apple-system,"PingFang SC",sans-serif; -webkit-font-smoothing:antialiased; }
  .bar { position:sticky; top:0; z-index:9; display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:12px 18px; background:rgba(10,39,51,.96); color:#fff; }
  .bar .t { font-size:14px; font-weight:700; }
  .bar .t small { display:block; font-weight:400; font-size:11px; color:#9db8ac; margin-top:2px; }
  .bar .btn { background:#b4e62a; color:#0a2733; font-weight:800; font-size:13px; text-decoration:none;
    padding:9px 18px; border-radius:9px; }
  .bar .btn:active { opacity:.85; }
  .canvas { max-width:760px; margin:18px auto 40px; padding:0 8px; }
  .canvas img { display:block; width:100%; height:auto; border-radius:12px;
    box-shadow:0 12px 40px -22px rgba(10,39,51,.55); background:#fff; }
  .hint { max-width:740px; margin:0 auto 20px; padding:12px 16px; background:#fff; border:1px solid #dde4e1;
    border-left:4px solid #1a6650; border-radius:10px; font-size:12.5px; color:#35484f; line-height:1.6; }
</style>
</head>
<body>
  <div class="bar">
    <div class="t">微信长图预览<small>显微镜下的酒店AI · 交付物料</small></div>
    <a class="btn" href="wechat-poster.jpg" download="显微镜下的酒店AI_长图.jpg">下载图片</a>
  </div>

  <div class="hint">手机微信上直接发本页的 <b>wechat-poster.jpg / wechat-poster.png</b> 原图即可，无需打开本页。本页仅用于电脑端稳定看图（避免直接点开超大 PNG 白屏）。</div>

  <div class="canvas">
    <img src="wechat-poster.jpg" alt="显微镜下的酒店AI 微信长图">
  </div>
</body>
</html>
